---
# Begin of file
# Example by Yulei Zhang

name: "validation_plots"
inject_hist: false

global_normalize: true

global_y_scale: 2
global_log_y: true
global_grid_y: true

global_ratio_plot: true
global_ratio_samples: [ "Testing", "Reference" ]
global_ratio_range: [ 0.5 , 1.5]

global_selection: "1"
global_selection_title: "Inclusive Validation"

variables:
  - name: "process_ID"
    range: [ 50, 0, 50]
    label: ["MC Process ID", ""]
  - name: "TagTrk2_pp[0]"
    range: [ 36,0,9000 ] # [bin size, min, max]
    label: [ "Leading E^{Tagging}_{Tracker}", "MeV" ]
  - name: "RecTrk2_pp[0]"
    range: [ 36,0,9000 ] # [bin size, min, max]
    label: [ "Leading E^{Recoil}_{Tracker}", "MeV" ]
  - name: "TagTrk2_pp[0] - RecTrk2_pp[0]"
    range: [ 32,0,8000 ] # [bin size, min, max]
    label: [ "Tracker missing P", "MeV" ]
  - name: "Acts_TagTrk_P[0]"
    range: [ 36,0,9000 ]
    label: [ "Acts Leading E^{Tagging}_{Tracker}", "MeV" ]
  - name: "Acts_RecTrk_P[0]"
    range: [ 36,0,9000 ]
    label: [ "Acts Leading E^{Recoil}_{Tracker}", "MeV" ]
  - name: "Acts_TagTrk_P[0] - Acts_RecTrk_P[0]"
    range: [ 32,0,8000 ]
    label: [ "Acts Tracker missing P", "MeV" ]


  - name: "ECAL_E_total[0]"
    vbins: [4000,5000,6000,6500,7000,7250,7500,7600,7700,7800,7900,8000,8100]
    label: [ "Truth E_{total}", "MeV" ]
    # Optional
    # selection_title: "Inclusive Validation"
    # y_scale: 0.15
    # log_y: false
    # normalize: true
    # grid_y : true
    # ratio_plot: true
    # ratio_samples: [ "Testing", "Reference" ]
    # ratio_range: [ 0.5 , 1.5]

  - name: "ECAL_Cluster_E_total"
    vbins: [4000,5000,6000,6500,7000,7250,7500,7600,7700,7800,7900,8000,8100]
    label: [ "Clustered E_{total}", "MeV" ]

  - name: "ECAL_Cluster_E[0]"
    vbins: [4000,5000,6000,6500,7000,7250,7500,7600,7700,7800,7900,8000,8100]
    label: [ "Leading E_{cluster}", "MeV" ]

  - name: "ECAL_Cluster_X[0]"
    range: [ 20, -60, 20 ] # [bin size, min, max]
    label: [ "Leading X_{cluster}", "mm" ]
  - name: "ECAL_Cluster_Y[0]"
    range: [ 20, -40,40 ] # [bin size, min, max]
    label: [ "Leading Y_{cluster}", "mm" ]
  - name: "ECAL_Cluster_Z[0]"
    range: [ 20, 200, 600 ] # [bin size, min, max]
    label: [ "Leading Z_{cluster}", "mm" ]

  - name: "ECAL_Cluster_NCell[0]"
    range: [ 20, 80, 180 ] # [bin size, min, max]
    label: [ "Leading Ncell_{cluster}", "" ]
  - name: "ECAL_Cluster_NSub[0]"
    range: [ 6, 0, 6 ] # [bin size, min, max]
    label: [ "Leading Nsub_{cluster}", "" ]

  - name: "ECAL_Cluster_NCell_total"
    range: [ 20, 80, 180 ] # [bin size, min, max]
    label: [ "N_Cell_total", "" ]
  - name: "ECAL_Cluster_N"
    range: [ 6, 0,6 ] # [bin size, min, max]
    label: [ "N_Cluster", "" ]

  - name: "HCAL_E_total[0]"
    range: [ 10, 0, 50 ] # [bin size, min, max]
    label: [ "E^{HCAL}_{total}", "MeV" ]
  - name: "HCAL_E_Max_Cell[0]"
    range: [ 10, 0, 50 ]
    label: [ "E^{HCAL}_{Cell Max}", "MeV"]

samples:
  - name: "Testing"
    # Mandatory
    file_name: "dp_ana.root"
    tree_name: "dp"
    # Optional
    selection: "1"
    line_attr: [ 4, 5 ] # [ color, width ]
    # marker_attr: [ 2, 0.95 , 3, 1 ] #[ color, transparency, width, style ]
    fill_attr: [ 4, 0.6, 1001 ] # [ color, transparency, style ]

  - name: "Reference"
    # Mandatory
    file_name: "ref.dp_ana.root"
    tree_name: "dp"
    # Optional
    selection: "1"
    line_attr: [ 6, 4 ] # [ color, width ]
    # marker_attr: [ 2, 3 ] #[ color, width, style ]
    fill_attr: [ 6, 0.6, 1001 ] # [ color, transparency, style ]


# End Of File
