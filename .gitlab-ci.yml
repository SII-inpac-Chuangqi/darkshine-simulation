# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/C++.gitlab-ci.yml

# use the official gcc image, based on debian
# can use versions as well, like gcc:5.2
# see https://hub.docker.com/_/gcc/

workflow:
  rules:
    # prevent run dulicate pipelines
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # run when [CI] in msg
    - if: $CI_COMMIT_MESSAGE =~ /[CI]/
      when: always
    # run when [VIP] in msg
    - if: $CI_COMMIT_MESSAGE =~ /[VIP]/
      when: always
    # always run branch pipeline when merge launched from (note for merged result the pipeline will run again: it needs PREMIUM :-(
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    # prevent others
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never
    # run in other cases like manual trig and merge finished
    - when: always

variables:
  # set to local to run at local server
  BUILD_RUNNER: remote

image: qibin2020/dss-base

build with ccache:
  stage: build
  script:
    - ./Automaton/build.sh
  artifacts:
    paths:
      - "install/*"
      - "test/*"
  cache:
    paths:
      - "build/ccache/*"

# run tests using the binary built before
# we use a central script to tun all the test, or it could be decomposed later
test simu and ana:
  stage: test
  dependencies: 
    - build with ccache
  script:
    - ./Automaton/test.sh
  artifacts:
    when: always
    paths:
      - "test/*"

ci write wiki:
  variables:
    # specify the filename you want to modify
    FILENAME: "test001.md"
  dependencies: 
    - test simu and ana
  script:
    # define URL for the wiki in terms of project-agnostic predefined variables
    # Note: This assumes a bot user has been generated by creating a Project Access Token,
    #       and the CI/CD variable "BOT_TOKEN" has been set to the value of the Token. 
    - export WIKI_URL="git@gitlab.com:dark_shine/darkshine-simulation.wiki.git"

    # clone this project's wiki under /tmp
    # Note: The bot user (Project Access Token) isn't actually needed for the clone
    #       operation as this could be done with CI_JOB_TOKEN. But using the
    #       bot user-scoped URL at clone-time saves us from having to update
    #       the push URL later.
    - rm -rf "/tmp/darkshine-simulation.wiki"
    - cd /tmp
    - git clone "${WIKI_URL}"

    # enter the cloned repo
    - cd "darkshine-simulation.wiki"

    # update the file
    - echo "This is a test, bye!" >> "$FILENAME"
    - date >> "$FILENAME"

    # set committer info
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"

    # commit the file
    - git add "$FILENAME"
    - git commit -m "WIKI update by CI"

    # push the change back to the master branch of the wiki
    - git push origin "HEAD:master"

